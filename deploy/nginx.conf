# nginx reverse proxy for the VISUMO website.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/visumo
#           sudo ln -s /etc/nginx/sites-available/visumo /etc/nginx/sites-enabled/visumo
#           sudo nginx -t && sudo systemctl reload nginx
# Then get a free certificate (it edits this file for you):
#           sudo certbot --nginx -d example.org -d www.example.org
# Replace example.org with your real domain. The app listens on 127.0.0.1:3000.
# In .env set: TRUST_PROXY=1, SITE_URL=https://example.org, and (after HTTPS works) FORCE_HTTPS=true.

upstream visumo_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org;

    client_max_body_size 1m;

    # The app already compresses responses; let it.
    gzip off;

    location / {
        proxy_pass http://visumo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
